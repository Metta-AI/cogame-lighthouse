<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lighthouse — Dev Shell</title>
<link rel="stylesheet" href="../chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">LIGHT<span>HOUSE</span></div>
      <div id="clock">TICK 0 / 45</div>
      <div id="topright">
        <span id="statuschip">fixture</span>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    <div id="transport">
      <div class="scrub" id="scrub"></div>
      <div class="tbar">
        <button class="tbtn" id="play">❚❚</button>
        <span class="tpos" id="pos">0 / 0</span>
      </div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<div id="loading">LOADING FIXTURE…</div>
<script src="../renderer.js"></script>
<script>
  // Dev shell: drives LighthouseRenderer.attachReplay straight from a JSON
  // payload (?payload=<url>, default sample_replay.json) — no wasm needed.
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  LighthouseRenderer.bindFeedToggle(document.getElementById("feedtoggle"), false);
  var url = new URLSearchParams(location.search).get("payload") ||
    "./sample_replay.json";
  fetch(url).then(function (r) { return r.json(); }).then(function (payload) {
    document.getElementById("loading").style.display = "none";
    fit();
    LighthouseRenderer.attachReplay({
      canvas: canvas,
      feed: document.getElementById("feed"),
      scrub: document.getElementById("scrub"),
      playButton: document.getElementById("play"),
      label: document.getElementById("pos"),
      clock: document.getElementById("clock"),
      scorebug: document.getElementById("scorebug"),
      endscreen: document.getElementById("endscreen"),
      assetBase: "../../data",
      payload: payload
    });
    // ?at=N pauses playback parked after event N (screenshot rigs).
    var at = new URLSearchParams(location.search).get("at");
    if (at !== null) {
      setTimeout(function () {
        var scrub = document.getElementById("scrub");
        var rect = scrub.getBoundingClientRect();
        var n = (payload.events || []).length || 1;
        var x = rect.left + Number(at) / n * rect.width + 0.5;
        var init = { clientX: x, clientY: rect.top + 10, pointerId: 1,
          bubbles: true };
        scrub.dispatchEvent(new PointerEvent("pointerdown", init));
        scrub.dispatchEvent(new PointerEvent("pointerup", init));
      }, 400);
    }
  }).catch(function (e) {
    document.getElementById("loading").textContent = "FIXTURE FAILED: " + e;
  });
</script>
</body>
</html>
